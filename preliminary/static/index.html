<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OCR Video Reader</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <h1>OCR Video Reader</h1>

  <details>
    <summary>Settings</summary>

    <label for="font-size">Text size</label>
    <select id="font-size">
      <option value="16">Normal</option>
      <option value="20">Large</option>
      <option value="28">Extra large</option>
    </select>

    <label for="theme">Theme</label>
    <select id="theme">
      <option value="light">Light</option>
      <option value="dark">Dark</option>
      <option value="high-contrast">High contrast</option>
    </select>
  </details>

  <form id="capture-form" novalidate>
    <label for="video-select">Video</label>
    <select id="video-select" aria-describedby="video-info">
      <option value="demo">demo</option>
    </select>
    <p id="video-info"></p>

    <label for="time-input">Time (seconds)</label>
    <input id="time-input" type="text" inputmode="decimal"
           aria-describedby="time-error">
    <p id="time-error" hidden></p>

    <button type="submit">Capture frame</button>
  </form>

  <p id="status" role="status" aria-live="polite"></p>

  <h2>Extracted text</h2>
  <pre id="ocr-text" tabindex="0"></pre>

  <h2>Frame preview</h2>
  <img id="frame-img" alt="">

  <script src="/static/app.js"></script>
</body>
</html>
